<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Local Trans Tanggul</title>
<style>
  :root { --brand:#E4460F; --bg:#FAF7F4; --card:#fff; --ink:#1F1A17; --mute:#6B625B; --line:#E7DFD8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { display:block; font-weight:600; margin:10px 0 4px; font-size:13px; }
  input,select,textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { font:inherit; font-weight:700; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; background:var(--brand); color:#fff; }
  button.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:#fff; color:#B3261E; border:1px solid #E9B8B4; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .bar .sp { flex:1; }
  .item { display:flex; gap:12px; align-items:center; }
  .item img { width:64px; height:48px; object-fit:cover; border-radius:8px; background:#eee; }
  .item b { display:block; }
  .item small { color:var(--mute); }
  .off { opacity:.5; }
  #msg { min-height:20px; font-size:13px; color:var(--mute); }
  #msg.err { color:#B3261E; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Admin Local Trans Tanggul</h1>
  <div id="msg" role="status"></div>

  <section class="card" id="loginBox" hidden>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password">
    <div class="bar"><button id="login" type="button">Masuk</button></div>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <button id="add" type="button">+ Produk baru</button>
      <button id="seed" class="alt" type="button" hidden>Impor produk bawaan</button>
      <span class="sp"></span>
      <a href="index.html">Lihat situs</a>
      <button id="logout" class="alt" type="button">Keluar</button>
    </div>
    <div id="list" style="margin-top:12px"></div>

    <form class="card" id="form" hidden>
      <b id="formTitle">Produk</b>
      <label for="fName">Nama</label><input id="fName" required>
      <div class="row">
        <div><label for="fCat">Kategori</label>
          <select id="fCat">
            <option value="antar">Antar Jemput</option><option value="kirim">Kirim</option>
            <option value="makanan">Makanan</option><option value="belanja">Belanja UMKM</option>
            <option value="lain">Lainnya</option>
          </select></div>
        <div><label for="fTpl">Template pesan WhatsApp</label>
          <select id="fTpl">
            <option value="food">Food (titip beli)</option><option value="ride">Ride</option>
            <option value="paket">Paket</option><option value="lain">Lainnya</option>
          </select></div>
      </div>
      <div class="row">
        <div><label for="fSub">Label kecil</label><input id="fSub" placeholder="Food / Ride / Send"></div>
        <div><label for="fEmoji">Emoji</label><input id="fEmoji" placeholder="🛵"></div>
      </div>
      <label for="fDesc">Deskripsi</label><textarea id="fDesc" rows="3"></textarea>
      <div class="row">
        <div><label for="fPrice">Harga / keterangan tarif</label><input id="fPrice" placeholder="Tarif via WA"></div>
        <div><label for="fBadge">Badge (opsional)</label><input id="fBadge" placeholder="0% komisi"></div>
      </div>
      <div class="row">
        <div><label for="fTone">Warna latar</label><input id="fTone" type="color" value="#FFE3D3"></div>
        <div><label for="fOrder">Urutan</label><input id="fOrder" type="number" value="100"></div>
      </div>
      <label for="fFile">Gambar (maks 2 MB; akan diperkecil otomatis)</label>
      <input id="fFile" type="file" accept="image/*">
      <img id="preview" alt="" style="max-width:200px;margin-top:8px;border-radius:8px" hidden>
      <label><input id="fActive" type="checkbox" checked style="width:auto"> Tampil di situs</label>
      <div class="bar">
        <button id="save" type="submit">Simpan</button>
        <button id="cancel" class="alt" type="button">Batal</button>
      </div>
    </form>
  </section>
</main>

<script type="module">
import { firebaseConfig, SDK, isConfigured } from './firebase-config.js';
const $ = s => document.querySelector(s);
const msg = (t, err) => { $('#msg').textContent = t || ''; $('#msg').className = err ? 'err' : ''; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

if (!isConfigured()) {
  msg('Isi firebase-config.js dengan config Firebase dulu.', true);
} else {
  const [{ initializeApp }, A, F, S] = await Promise.all([
    import(SDK + '/firebase-app.js'), import(SDK + '/firebase-auth.js'),
    import(SDK + '/firebase-firestore.js'), import(SDK + '/firebase-storage.js')
  ]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app), db = F.getFirestore(app), st = S.getStorage(app);
  const col = F.collection(db, 'products');

  // Produk bawaan, sama dengan katalog awal di index.html.
  const SEED = [
    { id:'ride', cat:'antar', name:'Ride Motor', sub:'Ride', emoji:'🛵', tone:'#FFE3D3', imgPath:'img/ride.jpg', desc:'Antar jemput ke kampus, kantor, pasar, atau stasiun oleh driver warga lokal Jember.', price:'Tarif via WA', tpl:'ride' },
    { id:'paket', cat:'kirim', name:'Kirim Paket', sub:'Send', emoji:'📦', tone:'#DCE8FF', imgPath:'img/paket.jpg', desc:'Paket atau barang diambil dari alamatmu, lalu diantar langsung ke alamat tujuan.', price:'Tarif via WA', tpl:'paket' },
    { id:'dokumen', cat:'kirim', name:'Kirim Dokumen', sub:'Send', emoji:'📄', tone:'#E9E3FF', imgPath:'img/dokumen.jpg', desc:'Berkas, surat, atau map diambil lalu diantar langsung ke alamat tujuan.', price:'Tarif via WA', tpl:'paket' },
    { id:'makanan', cat:'makanan', name:'Titip Beli Makanan', sub:'Food', emoji:'🍜', tone:'#FFF0C2', imgPath:'img/makanan.jpg', desc:'Pesan dari warung atau resto favoritmu. Harga makanan sama dengan harga warung.', price:'Harga warung + ongkir', badge:'Tanpa markup', tpl:'food' },
    { id:'umkm', cat:'belanja', name:'Titip Belanja UMKM', sub:'Food', emoji:'🛍️', tone:'#D9F5E6', imgPath:'img/umkm.jpg', desc:'Titip beli produk UMKM favoritmu. Kami tidak mengambil komisi tambahan, harga sama dengan harga toko.', price:'Harga toko + ongkir', badge:'0% komisi', tpl:'food' },
    { id:'lain', cat:'lain', name:'Pesanan Lainnya', sub:'Custom', emoji:'✍️', tone:'#EEF0F3', imgPath:'img/lain.jpg', desc:'Butuh bantuan lain? Tulis sendiri kebutuhanmu, admin akan membalas lewat WhatsApp.', price:'Tanya admin', tpl:'lain' }
  ];

  let items = [], editing = null; // editing: id dokumen, '' untuk baru

  const load = async () => {
    const snap = await F.getDocs(F.query(col, F.orderBy('order')));
    items = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    $('#seed').hidden = items.length > 0;
    $('#list').innerHTML = items.map(p => `
      <div class="card item ${p.active === false ? 'off' : ''}">
        <img src="${esc(p.img)}" alt="">
        <div style="flex:1"><b>${esc(p.name)}</b><small>${esc(p.cat)} · ${esc(p.price)}${p.active === false ? ' · disembunyikan' : ''}</small></div>
        <button class="alt" data-edit="${esc(p.id)}" type="button">Ubah</button>
        <button class="danger" data-del="${esc(p.id)}" type="button">Hapus</button>
      </div>`).join('') || '<div class="card">Belum ada produk. Situs memakai daftar bawaan sampai ada produk di sini.</div>';
  };

  // Perkecil gambar ke maks 1000px, JPEG, supaya hemat kuota.
  const shrink = file => new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? ok(b) : no(new Error('Gagal memproses gambar')); }, 'image/jpeg', .85);
    };
    img.onerror = () => no(new Error('File bukan gambar'));
    img.src = url;
  });

  const openForm = p => {
    editing = p ? p.id : '';
    $('#formTitle').textContent = p ? 'Ubah produk' : 'Produk baru';
    $('#fName').value = p?.name || ''; $('#fCat').value = p?.cat || 'antar'; $('#fTpl').value = p?.tpl || 'ride';
    $('#fSub').value = p?.sub || ''; $('#fEmoji').value = p?.emoji || ''; $('#fDesc').value = p?.desc || '';
    $('#fPrice').value = p?.price || 'Tarif via WA'; $('#fBadge').value = p?.badge || '';
    $('#fTone').value = p?.tone || '#FFE3D3'; $('#fOrder').value = p?.order ?? (items.length + 1) * 10;
    $('#fActive').checked = p?.active !== false; $('#fFile').value = '';
    $('#preview').hidden = !p?.img; if (p?.img) $('#preview').src = p.img;
    $('#form').hidden = false; $('#form').scrollIntoView({ behavior:'smooth' });
  };

  $('#add').onclick = () => openForm(null);
  $('#cancel').onclick = () => { $('#form').hidden = true; };
  $('#fFile').onchange = e => {
    const f = e.target.files[0];
    if (f) { $('#preview').src = URL.createObjectURL(f); $('#preview').hidden = false; }
  };

  $('#form').onsubmit = async e => {
    e.preventDefault();
    $('#save').disabled = true; msg('Menyimpan…');
    try {
      const old = items.find(p => p.id === editing);
      const ref = editing ? F.doc(col, editing) : F.doc(col);
      const data = {
        name: $('#fName').value.trim(), cat: $('#fCat').value, tpl: $('#fTpl').value,
        sub: $('#fSub').value.trim(), emoji: $('#fEmoji').value.trim(), desc: $('#fDesc').value.trim(),
        price: $('#fPrice').value.trim(), tone: $('#fTone').value, order: Number($('#fOrder').value) || 0,
        active: $('#fActive').checked, img: old?.img || '', imgPath: old?.imgPath || ''
      };
      const b = $('#fBadge').value.trim(); if (b) data.badge = b; else data.badge = F.deleteField();
      const file = $('#fFile').files[0];
      if (file) {
        const blob = await shrink(file);
        const path = `products/${ref.id}-${Date.now()}.jpg`;
        const r = S.ref(st, path);
        await S.uploadBytes(r, blob, { contentType:'image/jpeg' });
        data.img = await S.getDownloadURL(r);
        if (old?.imgPath?.startsWith('products/')) S.deleteObject(S.ref(st, old.imgPath)).catch(() => {});
        data.imgPath = path;
      }
      if (!data.img) throw new Error('Pilih gambar dulu.');
      await F.setDoc(ref, data, { merge:true });
      $('#form').hidden = true; msg('Tersimpan.'); await load();
    } catch (err) { msg(err.message, true); }
    $('#save').disabled = false;
  };

  $('#list').onclick = async e => {
    const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    try {
      if (ed) openForm(items.find(p => p.id === ed.dataset.edit));
      if (del && confirm('Hapus produk ini?')) {
        const p = items.find(x => x.id === del.dataset.del);
        await F.deleteDoc(F.doc(col, p.id));
        if (p.imgPath?.startsWith('products/')) S.deleteObject(S.ref(st, p.imgPath)).catch(() => {});
        msg('Dihapus.'); await load();
      }
    } catch (err) { msg(err.message, true); }
  };

  // Impor: unggah foto bawaan di img/ ke Storage lalu buat dokumennya.
  $('#seed').onclick = async () => {
    $('#seed').disabled = true;
    try {
      for (const [i, p] of SEED.entries()) {
        msg(`Mengimpor ${p.name}…`);
        const blob = await (await fetch(p.imgPath)).blob();
        const path = `products/${p.id}-seed.jpg`;
        const r = S.ref(st, path);
        await S.uploadBytes(r, blob, { contentType: blob.type || 'image/jpeg' });
        const { imgPath, ...rest } = p; delete rest.id;
        await F.setDoc(F.doc(col, p.id), { ...rest, img: await S.getDownloadURL(r), imgPath: path, order: (i + 1) * 10, active: true });
      }
      msg('Impor selesai.'); await load();
    } catch (err) { msg(err.message, true); }
    $('#seed').disabled = false;
  };

  $('#login').onclick = () => A.signInWithEmailAndPassword(auth, $('#em').value, $('#pw').value)
    .catch(() => msg('Email atau kata sandi salah.', true));
  $('#logout').onclick = () => A.signOut(auth);
  A.onAuthStateChanged(auth, async u => {
    $('#loginBox').hidden = !!u; $('#app').hidden = !u; msg('');
    if (u) { try { await load(); } catch (err) { msg(err.message, true); } }
  });
}
</script>
</body>
</html>
